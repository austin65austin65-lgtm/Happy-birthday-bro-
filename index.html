<title>Happy Birthday, Solen 💗</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background: #ff8da5;
    color: #5a3038;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
}

/* =========================
   SCREENS
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.screen.active {
    display: flex;
}


/* =========================
   OPENING
========================= */

#opening {
    background:
        radial-gradient(
            circle at 50% 40%,
            #ffd8e1 0%,
            #ff9db2 45%,
            #f87896 100%
        );
}

.opening-content {
    text-align: center;
    padding: 25px;
    animation: fadeUp 1.2s ease;
}

.opening-content .small {
    font-size: 18px;
    margin-bottom: 12px;
}

.opening-content h1 {
    font-size: clamp(38px, 11vw, 70px);
    font-style: italic;
    color: #6b3742;
    margin-bottom: 30px;
}

.open-btn {
    padding: 15px 35px;
    border-radius: 50px;
    background: #fff;
    color: #d85b78;
    font-size: 18px;
    box-shadow: 0 10px 25px rgba(80, 20, 30, .2);
    transition: .3s;
}

.open-btn:hover {
    transform: scale(1.08);
}


/* =========================
   GIFT
========================= */

#giftScreen {
    background: linear-gradient(#ffb5c5, #ff819c);
}

.gift-content {
    text-align: center;
}

.gift-content h2 {
    margin-bottom: 35px;
    font-size: 28px;
}

.gift {
    position: relative;
    width: 170px;
    height: 145px;
    margin: auto;
    cursor: pointer;
    animation: giftFloat 2s infinite ease-in-out;
}

.box {
    position: absolute;
    bottom: 0;
    width: 170px;
    height: 105px;
    background: #d95b78;
    border-radius: 8px;
    box-shadow: 0 15px 25px rgba(80, 20, 30, .25);
}

.box::before {
    content: "";
    position: absolute;
    left: 68px;
    width: 32px;
    height: 105px;
    background: #ffd6df;
}

.lid {
    position: absolute;
    top: 30px;
    left: -8px;
    width: 186px;
    height: 32px;
    background: #c94d6c;
    border-radius: 7px;
    z-index: 2;
    transition: .7s;
}

.ribbon {
    position: absolute;
    top: 0;
    left: 70px;
    width: 30px;
    height: 50px;
    background: #ffd6df;
    z-index: 3;
}

.bow-left,
.bow-right {
    position: absolute;
    top: -12px;
    width: 45px;
    height: 35px;
    background: #ffd6df;
    border-radius: 50%;
    z-index: 4;
}

.bow-left {
    left: 42px;
    transform: rotate(-25deg);
}

.bow-right {
    right: 42px;
    transform: rotate(25deg);
}

.gift.open .lid {
    transform: translateY(-70px) rotate(-8deg);
}

@keyframes giftFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}
